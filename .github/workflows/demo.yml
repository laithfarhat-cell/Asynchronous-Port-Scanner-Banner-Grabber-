name: Demo report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC

permissions:
  contents: read

jobs:
  demo:
    name: scan the loopback demo lab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Generate reports against the local lab only
        run: python scripts/demo_lab.py
      - uses: actions/upload-artifact@v7
        with:
          name: demo-reports
          path: reports/
